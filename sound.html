<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Reaction & Tactical Generator with File Save/Load</title>
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-card: #1e293b;
            --text-main: #f8fafc;
            --accent-color: #10b981;
            --accent-hover: #059669;
            --danger-color: #ef4444;
            --border-color: #334155;
            --btn-secondary: #3b82f6;
            --warning-color: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 16px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .display-card {
            background-color: var(--bg-card);
            border: 2px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            text-align: center;
            min-height: 220px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: background-color 0.15s ease, border-color 0.15s ease;
            position: relative;
        }

        .display-card.prep {
            background-color: #1e1b4b;
            border-color: #6366f1;
        }

        .display-card.flash {
            background-color: #065f46;
            border-color: #10b981;
        }

        .phase-badge {
            position: absolute;
            top: 12px;
            left: 12px;
            background: rgba(245, 158, 11, 0.2);
            color: var(--warning-color);
            border: 1px solid var(--warning-color);
            font-size: 0.75rem;
            font-weight: 700;
            padding: 4px 8px;
            border-radius: 6px;
            text-transform: uppercase;
        }

        .exercise-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(59, 130, 246, 0.2);
            color: var(--btn-secondary);
            border: 1px solid var(--btn-secondary);
            font-size: 0.75rem;
            font-weight: 700;
            padding: 4px 8px;
            border-radius: 6px;
        }

        .command-text {
            font-size: 2.5rem;
            font-weight: 800;
            line-height: 1.2;
            word-break: break-word;
            color: #ffffff;
        }

        .status-text {
            font-size: 0.9rem;
            color: #94a3b8;
            margin-top: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .controls {
            display: flex;
            gap: 12px;
        }

        .btn {
            flex: 1;
            padding: 16px;
            font-size: 1.2rem;
            font-weight: 700;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
        }

        .btn:active {
            opacity: 0.8;
            transform: scale(0.98);
        }

        .btn-start {
            background-color: var(--accent-color);
            color: #ffffff;
        }

        .btn-stop {
            background-color: var(--danger-color);
            color: #ffffff;
        }

        .btn-tempo {
            background-color: #334155;
            color: #ffffff;
            font-size: 0.85rem;
            padding: 10px;
        }

        .btn-action {
            padding: 8px 12px;
            font-size: 0.85rem;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .btn-blue {
            background-color: var(--btn-secondary);
            color: white;
        }

        .btn-red {
            background-color: var(--danger-color);
            color: white;
        }

        .btn-green {
            background-color: var(--accent-color);
            color: white;
        }

        .settings-card {
            background-color: var(--bg-card);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .card-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #94a3b8;
            margin-bottom: 4px;
            font-weight: 700;
        }

        .setting-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.95rem;
        }

        .setting-row label {
            font-weight: 500;
        }

        input[type="number"], select {
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            color: white;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.95rem;
        }

        input[type="number"] {
            width: 85px;
            text-align: center;
        }

        select {
            width: 100%;
        }

        input[type="range"] {
            flex: 1;
            margin-left: 12px;
            accent-color: var(--accent-color);
        }

        textarea {
            width: 100%;
            height: 80px;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            color: white;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.95rem;
            resize: vertical;
        }

        .toggle-container {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .toggle-container input {
            width: 18px;
            height: 18px;
            accent-color: var(--accent-color);
        }

        .tempo-controls {
            display: flex;
            gap: 8px;
        }

        .sequence-editor {
            background: var(--bg-primary);
            border: 1px dashed var(--border-color);
            padding: 12px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .seq-step {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
        }

        .seq-step span {
            font-weight: 700;
            color: var(--warning-color);
            width: 65px;
        }
    </style>
</head>
<body>

<div class="container">
    <div id="display" class="display-card">
        <div id="phaseBadge" class="phase-badge" style="display: none;">ФАЗА 1</div>
        <div id="exerciseBadge" class="exercise-badge">УПРАЖНЕНИЕ</div>
        <div id="commandDisplay" class="command-text">ГОТОВНОСТ</div>
        <div id="statusDisplay" class="status-text">Натиснете СТАРТ</div>
    </div>

    <div class="controls">
        <button id="startBtn" class="btn btn-start" onclick="toggleRun()">СТАРТ</button>
    </div>

    <!-- УПРАВЛЕНИЕ И СЪХРАНЕНИЕ НА ФАЙЛОВЕ -->
    <div class="settings-card" style="border: 1px solid var(--accent-color);">
        <div class="card-title" style="color: var(--accent-color);">💾 Съхранение на файлове (Backup)</div>
        <div style="display: flex; gap: 8px;">
            <button class="btn-action btn-green" style="flex:1;" onclick="exportToJsonFile()">📥 Свали като файл</button>
            <button class="btn-action btn-blue" style="flex:1;" onclick="document.getElementById('importFile').click()">📤 Зареди от файл</button>
            <input type="file" id="importFile" accept=".json" style="display: none;" onchange="importFromJsonFile(event)">
        </div>
    </div>

    <!-- ИЗБОР НА УПРАЖНЕНИЕ / СЦЕНАРИЙ -->
    <div class="settings-card" style="border: 1px solid var(--btn-secondary);">
        <div class="card-title" style="color: var(--btn-secondary);">1. Избор на Упражнение (Сценарий)</div>
        <div>
            <select id="exerciseSelect" onchange="switchExercise()"></select>
        </div>
        
        <div style="display: flex; gap: 8px; margin-top: 4px;">
            <button class="btn-action btn-blue" onclick="createExercise()">+ Ново Упражнение</button>
            <button class="btn-action btn-blue" onclick="renameExercise()">✏️ Преименувай</button>
            <button class="btn-action btn-red" onclick="deleteExercise()">🗑️ Изтрий</button>
        </div>

        <div class="sequence-editor" style="margin-top: 8px;">
            <div style="font-size: 0.8rem; color: #94a3b8; font-weight: 600;">Последователност от списъци за упражнението:</div>
            <div id="sequenceStepsContainer"></div>
            <button class="btn-action btn-blue" style="margin-top: 4px; align-self: flex-start;" onclick="addStepToExercise()">+ Добави фаза</button>
        </div>
    </div>

    <!-- УПРАВЛЕНИЕ НА СПИСЪЦИТЕ И ТЯХНИТЕ ИНДИВИДУАЛНИ ПАУЗИ -->
    <div class="settings-card">
        <div class="card-title">2. Редактиране на Списък и Индивидуални Паузи</div>
        <div>
            <select id="presetSelect" onchange="switchPreset()"></select>
        </div>
        
        <div style="display: flex; gap: 8px; margin-top: 4px;">
            <button class="btn-action btn-blue" onclick="createNewPreset()">+ Нов Списък</button>
            <button class="btn-action btn-blue" onclick="renameCurrentPreset()">✏️ Преименувай</button>
            <button class="btn-action btn-red" onclick="deleteCurrentPreset()">🗑️ Изтрий</button>
        </div>

        <div style="background: var(--bg-primary); padding: 10px; border-radius: 8px; margin-top: 6px; display: flex; flex-direction: column; gap: 8px;">
            <div style="font-size: 0.8rem; color: var(--warning-color); font-weight: 700; text-transform: uppercase;">Настройки за текущия списък:</div>
            <div class="setting-row">
                <label for="listDelayBefore" style="font-size: 0.85rem;">Пауза ПРЕДИ командата (сек):</label>
                <input type="number" id="listDelayBefore" value="0.5" step="0.1" min="0" max="5" onchange="saveCurrentPresetSettings()">
            </div>
            <div class="setting-row">
                <label for="listDelayAfter" style="font-size: 0.85rem;">Пауза СЛЕД командата (сек):</label>
                <input type="number" id="listDelayAfter" value="2.0" step="0.1" min="0.2" max="10" onchange="saveCurrentPresetSettings()">
            </div>
        </div>

        <div style="margin-top: 6px;">
            <label for="commandsInput" style="display:block; font-size: 0.8rem; color: #94a3b8; margin-bottom: 4px;">Команди в списъка (по една на ред):</label>
            <textarea id="commandsInput" oninput="saveCurrentPresetCommands()"></textarea>
        </div>
    </div>

    <!-- ТЕМПО И ГЛОБАЛНИ ПАУЗИ -->
    <div class="settings-card">
        <div class="card-title">3. Темпо и Крайна Пауза</div>
        <div class="tempo-controls">
            <button class="btn btn-tempo" onclick="adjustTempo(0.8)">🐢 Забави (-20%)</button>
            <button class="btn btn-tempo" onclick="resetTempo()">1.0x Нормално</button>
            <button class="btn btn-tempo" onclick="adjustTempo(1.25)">🐇 Забързай (+25%)</button>
        </div>

        <div class="setting-row" style="margin-top: 6px;">
            <label for="delayAfterExerciseInput">Пауза след цялото упражнение (сек):</label>
            <input type="number" id="delayAfterExerciseInput" value="2.5" step="0.2" min="0.5" max="10">
        </div>

        <div class="setting-row">
            <label for="speechRateInput">Скорост на речта: <span id="speechRateValue">1.2x</span></label>
            <input type="range" id="speechRateInput" min="0.5" max="2.0" step="0.1" value="1.2" oninput="updateSpeechRateLabel()">
        </div>
    </div>

    <!-- ЗВУК И ЕЗИК -->
    <div class="settings-card">
        <div class="card-title">4. Аудио Конфигурация</div>
        <div class="setting-row">
            <label class="toggle-container">
                <input type="checkbox" id="soundToggle" checked>
                Гласово изговаряне
            </label>
        </div>
        <div class="setting-row">
            <label class="toggle-container">
                <input type="checkbox" id="beepToggle">
                Звуков сигнал (Beep)
            </label>
        </div>
        <div class="setting-row">
            <label for="languageSelect">Език за реч:</label>
            <select id="languageSelect" style="width: 140px;">
                <option value="bg-BG" selected>Български</option>
                <option value="en-US">English</option>
            </select>
        </div>
    </div>
</div>

<script>
    let isRunning = false;
    let timerId = null;
    let audioCtx = null;
    let availableVoices = [];

    let presets = {
        "Поемане": {
            delayBefore: 0.5,
            delayAfter: 1.5,
            commands: ["Поемане ЛЯВО", "Поемане ДЯСНО"]
        },
        "Обръщане": {
            delayBefore: 0.3,
            delayAfter: 2.0,
            commands: ["Обръщане ЛЯВО", "Обръщане ДЯСНО", "Обръщане НАЗАД"]
        },
        "Пас": {
            delayBefore: 0.4,
            delayAfter: 2.5,
            commands: ["Пас ЛЯВО", "Пас ДЯСНО", "Пас НАПРЕД"]
        }
    };

    let exercises = {
        "Поемане ➔ Обръщане ➔ Пас": ["Поемане", "Обръщане", "Пас"],
        "Поемане ➔ Пас": ["Поемане", "Пас"]
    };

    let activePresetKey = "";
    let activeExerciseKey = "";
    let currentStepIndex = 0;

    function initData() {
        const savedPresets = localStorage.getItem('reaction_presets_v5');
        const savedExercises = localStorage.getItem('reaction_exercises_v5');

        if (savedPresets) {
            try { presets = JSON.parse(savedPresets); } catch(e) {}
        }
        if (savedExercises) {
            try { exercises = JSON.parse(savedExercises); } catch(e) {}
        }

        activePresetKey = Object.keys(presets)[0] || "Поемане";
        activeExerciseKey = Object.keys(exercises)[0] || "";

        renderPresetDropdown();
        renderExerciseDropdown();
        loadActivePresetToUI();
        renderSequenceEditor();
    }

    function saveData() {
        localStorage.setItem('reaction_presets_v5', JSON.stringify(presets));
        localStorage.setItem('reaction_exercises_v5', JSON.stringify(exercises));
    }

    // --- ФУНКЦИИ ЗА ЕКСПОРТ И ИМПОРТ НА ФАЙЛОВЕ ---
    function exportToJsonFile() {
        const dataObj = { presets, exercises };
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(dataObj, null, 2));
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", "reaction_exercises_backup.json");
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
    }

    function importFromJsonFile(event) {
        const fileReader = new FileReader();
        if (event.target.files[0]) {
            fileReader.readAsText(event.target.files[0], "UTF-8");
            fileReader.onload = (e) => {
                try {
                    const parsed = JSON.parse(e.target.result);
                    if (parsed.presets && parsed.exercises) {
                        presets = parsed.presets;
                        exercises = parsed.exercises;
                        saveData();
                        activePresetKey = Object.keys(presets)[0] || "";
                        activeExerciseKey = Object.keys(exercises)[0] || "";
                        renderPresetDropdown();
                        renderExerciseDropdown();
                        loadActivePresetToUI();
                        renderSequenceEditor();
                        alert("Упражненията бяха заредени успешно!");
                    } else {
                        alert("Невалиден формат на файла.");
                    }
                } catch (error) {
                    alert("Грешка при четене на файла.");
                }
            };
        }
    }

    // --- УПРАЖНЕНИЯ ---
    function renderExerciseDropdown() {
        const select = document.getElementById('exerciseSelect');
        select.innerHTML = '';
        Object.keys(exercises).forEach(name => {
            const opt = document.createElement('option');
            opt.value = name;
            opt.innerText = name;
            if (name === activeExerciseKey) opt.selected = true;
            select.appendChild(opt);
        });
        document.getElementById('exerciseBadge').innerText = activeExerciseKey || 'УПРАЖНЕНИЕ';
    }

    function switchExercise() {
        activeExerciseKey = document.getElementById('exerciseSelect').value;
        document.getElementById('exerciseBadge').innerText = activeExerciseKey;
        renderSequenceEditor();
    }

    function createExercise() {
        const name = prompt("Име на новото упражнение:");
        if (!name || !name.trim()) return;
        const trimmed = name.trim();
        if (exercises[trimmed]) return alert("Вече съществува.");

        exercises[trimmed] = [Object.keys(presets)[0]];
        activeExerciseKey = trimmed;
        saveData();
        renderExerciseDropdown();
        renderSequenceEditor();
    }

    function renameExercise() {
        const newName = prompt("Ново име:", activeExerciseKey);
        if (!newName || !newName.trim() || newName === activeExerciseKey) return;
        const trimmed = newName.trim();
        if (exercises[trimmed]) return alert("Името е заето.");

        exercises[trimmed] = exercises[activeExerciseKey];
        delete exercises[activeExerciseKey];
        activeExerciseKey = trimmed;
        saveData();
        renderExerciseDropdown();
    }

    function deleteExercise() {
        if (Object.keys(exercises).length <= 1) return alert("Трябва да има поне едно упражнение.");
        if (confirm(`Изтриване на "${activeExerciseKey}"?`)) {
            delete exercises[activeExerciseKey];
            activeExerciseKey = Object.keys(exercises)[0];
            saveData();
            renderExerciseDropdown();
            renderSequenceEditor();
        }
    }

    function renderSequenceEditor() {
        const container = document.getElementById('sequenceStepsContainer');
        container.innerHTML = '';

        const steps = exercises[activeExerciseKey] || [];
        const presetKeys = Object.keys(presets);

        steps.forEach((presetName, index) => {
            const row = document.createElement('div');
            row.className = 'seq-step';

            const label = document.createElement('span');
            label.innerText = `Фаза ${index + 1}:`;

            const select = document.createElement('select');
            presetKeys.forEach(pk => {
                const opt = document.createElement('option');
                opt.value = pk;
                opt.innerText = pk;
                if (pk === presetName) opt.selected = true;
                select.appendChild(opt);
            });

            select.onchange = (e) => {
                exercises[activeExerciseKey][index] = e.target.value;
                saveData();
            };

            const delBtn = document.createElement('button');
            delBtn.className = 'btn-action btn-red';
            delBtn.innerText = '✕';
            delBtn.onclick = () => {
                if (exercises[activeExerciseKey].length <= 1) return alert("Упражнението трябва да има поне 1 фаза.");
                exercises[activeExerciseKey].splice(index, 1);
                saveData();
                renderSequenceEditor();
            };

            row.appendChild(label);
            row.appendChild(select);
            row.appendChild(delBtn);
            container.appendChild(row);
        });
    }

    function addStepToExercise() {
        exercises[activeExerciseKey].push(Object.keys(presets)[0]);
        saveData();
        renderSequenceEditor();
    }

    // --- СПИСЪЦИ И ИНДИВИДУАЛНИ ПАУЗИ ---
    function renderPresetDropdown() {
        const select = document.getElementById('presetSelect');
        select.innerHTML = '';
        Object.keys(presets).forEach(name => {
            const opt = document.createElement('option');
            opt.value = name;
            opt.innerText = name;
            if (name === activePresetKey) opt.selected = true;
            select.appendChild(opt);
        });
    }

    function switchPreset() {
        activePresetKey = document.getElementById('presetSelect').value;
        loadActivePresetToUI();
    }

    function loadActivePresetToUI() {
        const p = presets[activePresetKey] || { delayBefore: 0.5, delayAfter: 2.0, commands: [] };
        document.getElementById('listDelayBefore').value = p.delayBefore;
        document.getElementById('listDelayAfter').value = p.delayAfter;
        document.getElementById('commandsInput').value = (p.commands || []).join('\n');
    }

    function saveCurrentPresetSettings() {
        if (!presets[activePresetKey]) return;
        presets[activePresetKey].delayBefore = parseFloat(document.getElementById('listDelayBefore').value) || 0;
        presets[activePresetKey].delayAfter = parseFloat(document.getElementById('listDelayAfter').value) || 0.5;
        saveData();
    }

    function saveCurrentPresetCommands() {
        if (!presets[activePresetKey]) return;
        const raw = document.getElementById('commandsInput').value;
        presets[activePresetKey].commands = raw.split('\n').map(c => c.trim()).filter(c => c.length > 0);
        saveData();
    }

    function createNewPreset() {
        const name = prompt("Име на новия списък:");
        if (!name || !name.trim()) return;
        const trimmed = name.trim();
        if (presets[trimmed]) return alert("Списъкът вече съществува.");

        presets[trimmed] = {
            delayBefore: 0.5,
            delayAfter: 2.0,
            commands: ["Команда 1"]
        };
        activePresetKey = trimmed;
        saveData();
        renderPresetDropdown();
        renderSequenceEditor();
        loadActivePresetToUI();
    }

    function renameCurrentPreset() {
        const newName = prompt("Ново име:", activePresetKey);
        if (!newName || !newName.trim() || newName === activePresetKey) return;
        const trimmed = newName.trim();
        if (presets[trimmed]) return alert("Името е заето.");

        presets[trimmed] = presets[activePresetKey];
        delete presets[activePresetKey];

        Object.keys(exercises).forEach(exKey => {
            exercises[exKey] = exercises[exKey].map(step => step === activePresetKey ? trimmed : step);
        });

        activePresetKey = trimmed;
        saveData();
        renderPresetDropdown();
        renderSequenceEditor();
        loadActivePresetToUI();
    }

    function deleteCurrentPreset() {
        if (Object.keys(presets).length <= 1) return alert("Трябва да остане поне един списък.");
        if (confirm(`Изтриване на "${activePresetKey}"?`)) {
            delete presets[activePresetKey];
            activePresetKey = Object.keys(presets)[0];
            saveData();
            renderPresetDropdown();
            renderSequenceEditor();
            loadActivePresetToUI();
        }
    }

    // --- АУДИО И РЕЧ ---
    function loadVoices() {
        if ('speechSynthesis' in window) availableVoices = window.speechSynthesis.getVoices();
    }
    loadVoices();
    if ('speechSynthesis' in window && window.speechSynthesis.onvoiceschanged !== undefined) {
        window.speechSynthesis.onvoiceschanged = loadVoices;
    }

    function unlockAudio() {
        if (!audioCtx) {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if (AudioContext) audioCtx = new AudioContext();
        }
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const silent = new SpeechSynthesisUtterance('');
            silent.volume = 0;
            window.speechSynthesis.speak(silent);
        }
    }

    function playBeep() {
        if (!audioCtx) return;
        try {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(880, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.15);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.15);
        } catch (e) {}
    }

    function speakText(text) {
        if (!('speechSynthesis' in window)) return;
        window.speechSynthesis.cancel();

        const utterance = new SpeechSynthesisUtterance(text);
        const selectedLang = document.getElementById('languageSelect').value;
        const rate = parseFloat(document.getElementById('speechRateInput').value);
        
        utterance.lang = selectedLang;
        utterance.rate = rate;
        utterance.pitch = 1.0;

        if (availableVoices.length > 0) {
            const matchedVoice = availableVoices.find(v => v.lang === selectedLang || v.lang.startsWith(selectedLang.split('-')[0]));
            if (matchedVoice) utterance.voice = matchedVoice;
        }

        window.speechSynthesis.speak(utterance);
    }

    function updateSpeechRateLabel() {
        const val = document.getElementById('speechRateInput').value;
        document.getElementById('speechRateValue').innerText = val + 'x';
    }

    function adjustTempo(factor) {
        const rateEl = document.getElementById('speechRateInput');
        rateEl.value = Math.max(0.5, Math.min(2.0, (parseFloat(rateEl.value) * factor))).toFixed(1);
        updateSpeechRateLabel();
    }

    function resetTempo() {
        document.getElementById('speechRateInput').value = 1.2;
        updateSpeechRateLabel();
    }

    // --- ИЗПЪЛНЕНИЕ НА УПРАЖНЕНИЕТО ---
    function executeNextPhase() {
        if (!isRunning) return;

        const steps = exercises[activeExerciseKey] || [];
        if (steps.length === 0) {
            stop();
            return;
        }

        if (currentStepIndex >= steps.length) {
            currentStepIndex = 0;
            const displayEl = document.getElementById('display');
            displayEl.className = 'display-card prep';
            document.getElementById('phaseBadge').style.display = 'none';
            document.getElementById('commandDisplay').innerText = 'КРАЙ НА СЕРИЯТА';
            document.getElementById('statusDisplay').innerText = 'ИЗЧАКВАНЕ ПРЕДИ НОВО...';

            const delayAfterEx = parseFloat(document.getElementById('delayAfterExerciseInput').value) * 1000;
            timerId = setTimeout(executeNextPhase, delayAfterEx);
            return;
        }

        const currentPresetName = steps[currentStepIndex];
        const presetData = presets[currentPresetName] || { delayBefore: 0.5, delayAfter: 2.0, commands: [] };

        const badge = document.getElementById('phaseBadge');
        badge.innerText = `Фаза ${currentStepIndex + 1}/${steps.length}: ${currentPresetName}`;
        badge.style.display = 'block';

        const displayEl = document.getElementById('display');
        displayEl.className = 'display-card prep';
        document.getElementById('commandDisplay').innerText = '...';
        document.getElementById('statusDisplay').innerText = `ПОДГОТОВКА (${currentPresetName})`;

        const delayBefore = (presetData.delayBefore || 0) * 1000;

        timerId = setTimeout(() => {
            if (!isRunning) return;

            const commands = presetData.commands || [];
            if (commands.length === 0) {
                document.getElementById('commandDisplay').innerText = 'ПРАЗЕН СПИСЪК';
            } else {
                const randomIndex = Math.floor(Math.random() * commands.length);
                const command = commands[randomIndex];

                displayEl.className = 'display-card flash';
                document.getElementById('commandDisplay').innerText = command;
                document.getElementById('statusDisplay').innerText = 'РЕАКЦИЯ!';

                if (document.getElementById('beepToggle').checked) playBeep();
                if (document.getElementById('soundToggle').checked) speakText(command);
            }

            currentStepIndex++;

            const delayAfter = (presetData.delayAfter || 1.0) * 1000;
            timerId = setTimeout(executeNextPhase, delayAfter);

        }, delayBefore);
    }

    function toggleRun() {
        unlockAudio();
        if (isRunning) {
            stop();
        } else {
            start();
        }
    }

    function start() {
        const steps = exercises[activeExerciseKey] || [];
        if (steps.length === 0) return alert('Моля, добавете фази към упражнението.');

        isRunning = true;
        currentStepIndex = 0;

        const btn = document.getElementById('startBtn');
        btn.innerText = 'СТОП';
        btn.className = 'btn btn-stop';

        executeNextPhase();
    }

    function stop() {
        isRunning = false;
        clearTimeout(timerId);
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();

        const displayEl = document.getElementById('display');
        displayEl.className = 'display-card';
        document.getElementById('phaseBadge').style.display = 'none';
        
        const btn = document.getElementById('startBtn');
        btn.innerText = 'СТАРТ';
        btn.className = 'btn btn-start';
        document.getElementById('commandDisplay').innerText = 'ГОТОВНОСТ';
        document.getElementById('statusDisplay').innerText = 'ПАУЗА';
    }

    initData();
</script>
</body>
</html>
